<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المنتدى - رفوف</title><link rel="stylesheet" href="css/style.css"></head>
<body><header><h1>💬 منتدى رفوف</h1></header><main style="max-width:800px;margin:0 auto;padding:20px"><div id="messages" style="height:400px;overflow:auto;border:1px solid #333;padding:10px"></div><form id="msg-form"><input id="msg" placeholder="اكتب رسالة..."><button>إرسال</button></form></main>
<script>
const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/forum/websocket');
ws.onmessage=e=>{ const div=document.createElement('div'); div.textContent=e.data; document.getElementById('messages').appendChild(div); };
document.getElementById('msg-form').addEventListener('submit',e=>{ e.preventDefault(); ws.send(document.getElementById('msg').value); document.getElementById('msg').value=''; });
</script></body></html>
