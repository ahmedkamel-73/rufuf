<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title id="pageTitle">القارئ - رفوف</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script>pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:#0f0f0f;color:#eee;overflow:hidden;height:100vh}
.pdf-toolbar{position:fixed;top:0;left:0;right:0;background:linear-gradient(135deg,#111,#1a1a2e);padding:8px 12px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;z-index:1000;box-shadow:0 2px 10px rgba(0,0,0,.4);border-bottom:2px solid #ff6b00}
.pdf-toolbar button,.pdf-toolbar select{background:rgba(255,255,255,.12);border:none;color:#fff;padding:7px 12px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;transition:.2s;font-family:'Cairo'}
.pdf-toolbar button:hover{background:#ff6b00;transform:translateY(-1px)} .pdf-toolbar .active{background:#ff6b00}
.separator{width:1px;height:26px;background:rgba(255,255,255,.2);margin:0 4px}
.page-controls{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.35);padding:4px 10px;border-radius:40px}
.page-controls input{width:55px;text-align:center;background:rgba(255,255,255,.2);border:none;color:#fff;padding:4px;border-radius:6px;font-family:'Cairo'}
#pdf-container{position:absolute;top:58px;left:0;right:0;bottom:0;overflow:auto;background:#1a1a1a;padding:20px 10px 100px;display:flex;flex-direction:column;align-items:center;gap:16px}
.pdf-page{background:#fff;border-radius:4px;box-shadow:0 4px 20px rgba(0,0,0,.6);position:relative;max-width:100%}
.pdf-page canvas{display:block;width:100% !important;height:auto !important}
.page-num{position:absolute;top:5px;left:5px;background:rgba(0,0,0,.7);color:#fff;font-size:10px;padding:2px 8px;border-radius:20px}
#shareBox{max-width:900px;width:100%;background:#111;border:1px solid #222;border-radius:12px;padding:10px;margin:10px auto}
#shareBox h4{font-size:13px;color:#ff6b00;margin-bottom:8px}
.share-row{display:flex;gap:6px;flex-wrap:wrap}
.share-row a,.share-row button{padding:7px 12px;border-radius:100px;color:#fff;text-decoration:none;font-size:12px;border:none;cursor:pointer;font-family:'Cairo'}
.wa{background:#25D366}.fb{background:#1877F2}.tg{background:#26A5E4}.cp{background:#2a2a2a;border:1px solid #333 !important}.author{background:#ff6b00}
.night-mode #pdf-container{background:#000} .night-mode .pdf-page{filter:brightness(.9) contrast(1.1)}
.ad{max-width:900px;width:100%;margin:8px auto;padding:10px;background:#111;border:1px dashed #444;border-radius:10px;text-align:center;font-size:12px}
.ad.p{border-color:#ff6b00} .ad.pub{border-color:#22c55e;background:#0e1a0e}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:100px;color:#fff;z-index:2000;font-size:13px;box-shadow:0 4px 20px rgba(0,0,0,.5)}
.floating{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(20,20,20,.95);backdrop-filter:blur(10px);border:1px solid #333;border-radius:100px;padding:8px 12px;display:flex;gap:6px;align-items:center;z-index:900;transition:transform .3s,opacity .3s}
.floating.hide{transform:translate(-50%,100px);opacity:0}
</style>
</head>
<body>
<div class="pdf-toolbar" id="toolbar">
<button onclick="location.href='index.html'"><i class="fas fa-home"></i> الرئيسية</button>
<div class="separator"></div>
<button id="prevBtn" onclick="prevPage()"><i class="fas fa-chevron-right"></i> السابق</button>
<div class="page-controls"><input type="number" id="pageNum" value="1" min="1"> / <span id="pageCount">--</span></div>
<button id="nextBtn" onclick="nextPage()">التالي <i class="fas fa-chevron-left"></i></button>
<div class="separator"></div>
<button onclick="zoomOut()"><i class="fas fa-search-minus"></i></button><span id="zoomLab" style="font-size:11px;min-width:32px;text-align:center">100%</span><button onclick="zoomIn()"><i class="fas fa-search-plus"></i></button>
<div class="separator"></div>
<button id="nightBtn" onclick="toggleNight()"><i class="fas fa-moon"></i></button>
<button onclick="toggleFull()"><i class="fas fa-expand"></i></button>
</div>

<div id="pdf-container">
<div class="ad p" id="ad1">إعلان المنصة</div>
<div class="ad pub" id="ad2">إعلان الناشر</div>
<div id="shareBox"><h4>📤 شارك هذا الكتاب</h4><div class="share-row" id="shareTop"></div></div>
<div id="viewer" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:16px"><p style="color:#666;padding:40px">📖 جاري تحميل الكتاب...<br><small style="color:#444">لو تأخر، تأكد أن worker V19 مرفوع</small></p></div>
<div id="shareBox2" style="max-width:900px;width:100%;background:#111;border:1px solid #222;border-radius:12px;padding:10px"><h4>📤 عجبك؟ شاركه</h4><div class="share-row" id="shareBot"></div></div>
<div class="ad pub" id="ad3">إعلان الناشر أسفل</div>
<div class="ad p" id="ad4">إعلان المنصة أسفل</div>
</div>

<div class="floating" id="floatBar">
<button onclick="prevPage()">›</button>
<input id="floatPage" type="number" value="1" min="1" style="width:50px;background:#111;border:1px solid #333;color:#fff;border-radius:8px;padding:4px;text-align:center"> / <span id="floatCount">--</span>
<button onclick="nextPage()">‹</button>
</div>

<script src="js/api.js"></script><script src="js/ads.js"></script>
<script>
let pdf=null, cur=1, total=0, scale=1.5, book=null, bookId=null;
let isNight=false, lastScroll=0;

async function init(){
 bookId=new URLSearchParams(location.search).get('id');
 if(!bookId){document.getElementById('viewer').innerHTML='لم يحدد كتاب';return;}
 try{
  const data=await fetch('/api/books/'+bookId).then(r=>r.json());
  if(data.error){document.getElementById('viewer').innerHTML=data.error;return;}
  book=data;
  document.getElementById('pageTitle').textContent=data.title+' - رفوف';
  const url=location.href;
  const encUrl=encodeURIComponent(url);
  const encTitle=encodeURIComponent(data.title);
  const authorLink=data.owner_id?`author.html?id=${data.owner_id}`:'index.html';
  const sh=`<a class="wa" href="https://wa.me/?text=${encTitle}%20${encUrl}" target="_blank">واتساب</a><a class="fb" href="https://www.facebook.com/sharer/sharer.php?u=${encUrl}" target="_blank">فيسبوك</a><a class="tg" href="https://t.me/share/url?url=${encUrl}&text=${encTitle}" target="_blank">تليجرام</a><button class="cp" onclick="navigator.clipboard.writeText('${url}');alert('✅ تم النسخ')">🔗 نسخ</button><a class="author" href="${authorLink}">👤 الناشر</a>`;
  document.getElementById('shareTop').innerHTML=sh; document.getElementById('shareBot').innerHTML=sh;
  try{const p=await fetchAds('reader'); if(p[0]) renderAd(p[0],'ad1'); if(p[1]) renderAd(p[1],'ad4'); if(data.owner_id){const pub=await fetchAds('reader',data.owner_id); if(pub[0]) renderAd(pub[0],'ad2'); if(pub[1]) renderAd(pub[1],'ad3');}}catch(e){}
  if(!data.file_url){document.getElementById('viewer').innerHTML='<p style="color:#888">'+(data.description||'لا يوجد ملف')+'</p>';return;}
  await loadPDF(data.file_url);
 }catch(e){document.getElementById('viewer').innerHTML='خطأ: '+e.message;}
}

async function loadPDF(url){
 try{
  // نفس إعدادات ملف الـ PHP اللي شغال صح
  const loadingTask=pdfjsLib.getDocument({
    url:url,
    cMapUrl:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/cmaps/',
    cMapPacked:true,
    standardFontDataUrl:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/standard_fonts/',
    disableFontFace:false,
    useSystemFonts:false,
    enableXfa:false,
    isEvalSupported:false
  });
  pdf=await loadingTask.promise;
  total=pdf.numPages;
  document.getElementById('pageCount').textContent=total;
  document.getElementById('floatCount').textContent=total;
  document.getElementById('pageNum').max=total;
  document.getElementById('floatPage').max=total;
  renderAll();
 }catch(e){
  console.error(e);
  document.getElementById('viewer').innerHTML=`<div style="text-align:center;color:#ef4444;padding:20px">فشل فتح القارئ: ${e.message}<br><a href="${url}" target="_blank" style="color:#ff6b00">تحميل الملف</a></div>`;
 }
}

async function renderAll(){
 const viewer=document.getElementById('viewer'); viewer.innerHTML='';
 const dpr=window.devicePixelRatio||1;
 for(let i=1;i<=total;i++){
  const wrap=document.createElement('div'); wrap.className='pdf-page'; wrap.id='p'+i;
  const canvas=document.createElement('canvas'); wrap.appendChild(canvas);
  const lab=document.createElement('div'); lab.className='page-num'; lab.textContent='صفحة '+i; wrap.appendChild(lab);
  viewer.appendChild(wrap);
  const obs=new IntersectionObserver(async (es)=>{
    if(es[0].isIntersecting){
      obs.disconnect();
      try{
        const page=await pdf.getPage(i);
        const vp=page.getViewport({scale:scale});
        // جودة عالية للعربي - نفس فكرة ملف PHP
        const pixelRatio=dpr*1.8;
        canvas.width=vp.width*pixelRatio;
        canvas.height=vp.height*pixelRatio;
        canvas.style.width='100%';
        canvas.style.maxWidth='800px';
        const ctx=canvas.getContext('2d');
        ctx.setTransform(pixelRatio,0,0,pixelRatio,0,0);
        await page.render({canvasContext:ctx,viewport:vp}).promise;
      }catch(e){console.error('render page',i,e);}
    }
  },{rootMargin:'800px'});
  obs.observe(wrap);
 }
}

function zoomIn(){scale=Math.min(3,scale+0.2); document.getElementById('zoomLab').textContent=Math.round(scale*100)+'%'; renderAll();}
function zoomOut(){scale=Math.max(0.6,scale-0.2); document.getElementById('zoomLab').textContent=Math.round(scale*100)+'%'; renderAll();}
function prevPage(){if(cur>1){cur--; syncPage(); document.getElementById('p'+cur)?.scrollIntoView({behavior:'smooth',block:'start'});}}
function nextPage(){if(cur<total){cur++; syncPage(); document.getElementById('p'+cur)?.scrollIntoView({behavior:'smooth',block:'start'});}}
function syncPage(){document.getElementById('pageNum').value=cur; document.getElementById('floatPage').value=cur;}
document.getElementById('pageNum').addEventListener('change',e=>{let p=parseInt(e.target.value); if(p>=1&&p<=total){cur=p; syncPage(); document.getElementById('p'+p)?.scrollIntoView({behavior:'smooth'});}});
document.getElementById('floatPage').addEventListener('change',e=>{let p=parseInt(e.target.value); if(p>=1&&p<=total){cur=p; syncPage(); document.getElementById('p'+p)?.scrollIntoView({behavior:'smooth'});}});
function toggleNight(){isNight=!isNight; document.body.classList.toggle('night-mode',isNight); localStorage.setItem('rufuf_night',isNight); document.getElementById('nightBtn').innerHTML=isNight?'<i class="fas fa-sun"></i>':'<i class="fas fa-moon"></i>';}
function toggleFull(){if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen();}
if(localStorage.getItem('rufuf_night')==='true'){isNight=true; document.body.classList.add('night-mode'); document.getElementById('nightBtn').innerHTML='<i class="fas fa-sun"></i>';}
// شريط عائم يختفي مع النزول
let tick=false;
document.getElementById('pdf-container').addEventListener('scroll',()=>{
 if(!tick){requestAnimationFrame(()=>{
  const c=document.getElementById('pdf-container'); const st=c.scrollTop; const bar=document.getElementById('floatBar');
  if(st>lastScroll && st>200) bar.classList.add('hide'); else bar.classList.remove('hide');
  lastScroll=st; tick=false;
 }); tick=true;}
});
// تحديث رقم الصفحة حسب السكرول
document.getElementById('pdf-container').addEventListener('scroll',()=>{
 const pages=document.querySelectorAll('.pdf-page'); let closest=cur, min=Infinity;
 pages.forEach((p,i)=>{const r=p.getBoundingClientRect(); const d=Math.abs(r.top-80); if(d<min && r.top<=300){min=d; closest=i+1;}});
 if(closest!==cur){cur=closest; syncPage();}
});
init();
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
</html>
