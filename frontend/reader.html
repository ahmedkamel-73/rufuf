<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:#0A0A0A;color:#eee;overflow:hidden;height:100vh}
.pdf-toolbar{position:fixed;top:0;left:0;right:0;background:linear-gradient(135deg,#111,#1a1a1a);padding:8px 12px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;z-index:1000;box-shadow:0 2px 10px rgba(0,0,0,.5);border-bottom:2px solid #FF6B00}
.pdf-toolbar button{background:rgba(255,255,255,.08);border:1px solid #232323;color:#fff;padding:7px 12px;border-radius:8px;cursor:pointer;font-size:12px;font-family:'Cairo';transition:.2s}
.pdf-toolbar button:hover{background:#FF6B00;color:#000;transform:translateY(-1px)}
.pdf-toolbar .active{background:#FF6B00;color:#000}
.separator{width:1px;height:26px;background:rgba(255,255,255,.15);margin:0 4px}
.page-controls{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.4);padding:4px 12px;border-radius:40px}
.page-controls input{width:56px;text-align:center;background:rgba(255,255,255,.12);border:0;color:#fff;padding:4px;border-radius:6px;font-family:'Cairo'}
.auto-scroll-control{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.4);padding:4px 15px;border-radius:40px}
.auto-scroll-control button.running{background:#ef4444;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
#pdfContainer{position:absolute;top:56px;left:0;right:0;bottom:0;overflow:auto;background:#0F0F0F;display:flex;flex-direction:column;align-items:center;padding:20px;gap:16px}
.pdf-page{background:#fff;box-shadow:0 4px 15px rgba(0,0,0,.2);border-radius:4px;overflow:hidden}
.pdf-page canvas{display:block;width:100%;height:auto}
.pdf-page-wrapper{position:relative;margin:10px 0;width:100%;max-width:850px}
.pdf-page-label{text-align:center;padding:6px;background:rgba(0,0,0,.6);color:#fff;border-radius:10px 10px 0 0;font-size:12px}
.pdf-sidebar{position:fixed;right:-320px;top:56px;width:300px;bottom:0;background:linear-gradient(180deg,#111,#1a1a1a);transition:right .3s;z-index:1001;overflow-y:auto;padding:20px;border-left:1px solid #FF6B00}
.pdf-sidebar.open{right:0}
.sidebar-toggle{position:fixed;right:15px;top:68px;background:#FF6B00;border:0;color:#fff;width:42px;height:42px;border-radius:50%;cursor:pointer;z-index:1002;font-size:20px;display:flex;align-items:center;justify-content:center}
.bookmark-item{background:rgba(255,255,255,.08);padding:12px;margin-bottom:10px;border-radius:10px;cursor:pointer;border-right:3px solid transparent}
.bookmark-item:hover{background:rgba(255,107,0,.3);border-right-color:#FF6B00}
.mini-share-bar{position:fixed;bottom:25px;right:25px;display:flex;gap:10px;background:rgba(0,0,0,.75);backdrop-filter:blur(10px);padding:10px 15px;border-radius:50px;z-index:1000;border:1px solid rgba(255,255,255,.2)}
.mini-share-btn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:16px;transition:.2s;cursor:pointer;border:0}
.mini-share-btn:hover{transform:scale(1.1)}
.share-wa{background:#25D366;color:#fff}.share-fb{background:#1877F2;color:#fff}.share-x{background:#000;color:#fff;border:1px solid #333}.share-copy{background:#64748b;color:#fff}
body.night-mode #pdfContainer{background:#0a0a15}
body.night-mode .pdf-page canvas{filter:brightness(.85) contrast(1.1)}
#pdfContainer::-webkit-scrollbar{width:8px} #pdfContainer::-webkit-scrollbar-thumb{background:#FF6B00;border-radius:4px}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#FF6B00;color:#000;padding:10px 24px;border-radius:50px;z-index:2000;font-size:13px;font-weight:700}
.loading-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.9);z-index:2000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:15px}
.loading-spinner{width:50px;height:50px;border:4px solid rgba(255,255,255,.2);border-top:4px solid #FF6B00;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
.ad-box{max-width:900px;width:100%;margin:10px auto;padding:12px;background:#111;border:1px dashed #333;border-radius:12px;text-align:center;min-height:60px;display:flex;align-items:center;justify-content:center}
.ad-box.platform{border-color:#FF6B00}
.ad-box.publisher{border-color:#22c55e;background:#0e1a0e}
.ad-box:empty{display:none}

<body>
<div class="pdf-toolbar">
<button onclick="location.href='index.html'">🏠</button>
<button onclick="toggleSidebar()">🔖</button>

<button onclick="toggleNightMode()">🌙</button>

<div class="auto-scroll-control"><button id="autoScrollBtn" onclick="toggleAutoScroll()">▶️</button><input type="range" id="scrollSpeed" min="1" max="20" value="5" onchange="updateScrollSpeed()"><span id="speedValue">5</span></div>
<div class="separator"></div>

<div class="mini-share-bar"><a id="shareWaBtn" target="_blank" class="mini-share-btn share-wa">💬</a><a id="shareFbBtn" target="_blank" class="mini-share-btn share-fb">f</a><a id="shareXBtn" target="_blank" class="mini-share-btn share-x">𝕏</a><button class="mini-share-btn share-copy" onclick="copyShareLink()">📋</button></div>

<div class="loading-overlay" id="loadingOverlay"><div class="loading-spinner"></div><div style="color:#fff">جاري تحميل الكتاب...</div><div style="color:#666;font-size:11px;max-width:300px;text-align:center">إصلاح الخط العربي: cMap + HD canvas ×1.8 + disableFontFace:false</div></div>
<!-- نظام الإعلانات - 4 أماكن مثل موقعك الـ PHP -->
<div class="ad-box platform" id="ad1">⏳ جاري تحميل إعلان المنصة العلوي...</div>
<div class="ad-box publisher" id="ad2">⏳ جاري تحميل إعلان الناشر العلوي... (يظهر للناشر فقط)</div>
<div id="pdfViewer" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:16px"></div>
<div class="ad-box publisher" id="ad3">⏳ إعلان الناشر السفلي</div>
<div class="ad-box platform" id="ad4">⏳ إعلان المنصة السفلي</div>
</div>
<script>
// نظام الإعلانات الكامل - مثل ملف ads.php
async function loadAds() {
  try {
    // إعلانات المنصة العامة
    const res = await fetch('/api/ads?placement=reader');
    if (res.ok) {
      const ads = await res.json();
      if (ads.length > 0) {
        // ad1 - منصة علوي
        if (ads[0]) {
          const ad1 = document.getElementById('ad1');
          ad1.innerHTML = ads[0].custom_html || (ads[0].image_url ? `<a href="${ads[0].link_url}" target="_blank"><img src="${ads[0].image_url}" style="max-width:100%;border-radius:8px"></a>` : ads[0].title);
          // تنفيذ سكريبتات الإعلانات مثل A-ADS
          ad1.querySelectorAll('script').forEach(old => {
            const s = document.createElement('script');
            s.innerHTML = old.innerHTML;
            if (old.src) s.src = old.src;
            document.head.appendChild(s);
          });
        }
        // ad4 - منصة سفلي
        if (ads[1]) {
          const ad4 = document.getElementById('ad4');
          ad4.innerHTML = ads[1].custom_html || (ads[1].image_url ? `<a href="${ads[1].link_url}" target="_blank"><img src="${ads[1].image_url}" style="max-width:100%"></a>` : ads[1].title);
          ad4.querySelectorAll('script').forEach(old => {
            const s = document.createElement('script');
            s.innerHTML = old.innerHTML;
            if (old.src) s.src = old.src;
            document.head.appendChild(s);
          });
        }
      } else {
        document.getElementById('ad1').style.display='none';
        document.getElementById('ad4').style.display='none';
      }
    }
    // إعلانات الناشر الخاصة بالكتاب
    if (bookData && bookData.owner_id) {
      const res2 = await fetch('/api/ads?placement=reader&owner_id=' + bookData.owner_id);
      if (res2.ok) {
        const pubAds = await res2.json();
        if (pubAds.length > 0) {
          if (pubAds[0]) {
            const ad2 = document.getElementById('ad2');
            ad2.innerHTML = pubAds[0].custom_html || `<a href="${pubAds[0].link_url}" target="_blank"><img src="${pubAds[0].image_url}" style="max-width:100%"></a>`;
            ad2.style.display='flex';
          }
          if (pubAds[1]) {
            const ad3 = document.getElementById('ad3');
            ad3.innerHTML = pubAds[1].custom_html || `<a href="${pubAds[1].link_url}" target="_blank"><img src="${pubAds[1].image_url}" style="max-width:100%"></a>`;
            ad3.style.display='flex';
          }
        } else {
          document.getElementById('ad2').style.display='none';
          document.getElementById('ad3').style.display='none';
        }
      }
    } else {
      document.getElementById('ad2').style.display='none';
      document.getElementById('ad3').style.display='none';
    }
  } catch(e) { console.log('Ads error', e); }
}

const params = new URLSearchParams(location.search);
const bookId = params.get('id');
let pdfDoc=null, currentPage=1, currentScale=1.6, totalPages=0, viewMode=localStorage.getItem('viewMode')||'scrolling', pageElements=[], autoScrollActive=false, autoScrollInterval=null, scrollSpeed=5, bookData=null;
let isNight=localStorage.getItem('nightMode')==='true', isFocus=localStorage.getItem('focusMode')==='true';
const pdfViewer=document.getElementById('pdfViewer'), container=document.getElementById('pdfContainer'), pageNumInput=document.getElementById('pageNum'), pageCountSpan=document.getElementById('pageCount'), zoomLevelSpan=document.getElementById('zoomLevel'), loadingOverlay=document.getElementById('loadingOverlay');

async function loadBook(){
 try{
  const res=await fetch('/api/books/'+bookId);
  const data=await res.json();
  if(data.error){loadingOverlay.innerHTML='<div style="color:#f44">'+data.error+'</div>';return;}
  bookData=data;
  document.getElementById('pageTitle').textContent='قراءة: '+data.title+' - رفوف';
  if(!data.file_url){loadingOverlay.innerHTML='<div style="color:#fa0">لا يوجد PDF<br>'+(data.description||'')+'</div>';return;}
  await loadAds();
  await loadPDF(data.file_url);
 }catch(e){loadingOverlay.innerHTML='خطأ: '+e.message;}
}

async function loadPDF(url){
 try{
  const task=pdfjsLib.getDocument({
    url:url,
    cMapUrl:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/cmaps/',
    cMapPacked:true,
    standardFontDataUrl:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/standard_fonts/',
    disableFontFace:false,
    useSystemFonts:false,
    enableXfa:false,
    isEvalSupported:false
  });
  pdfDoc=await task.promise;
  totalPages=pdfDoc.numPages;
  pageCountSpan.textContent='/ '+totalPages;
  pageNumInput.max=totalPages;
  if(isNight) document.body.classList.add('night-mode');
  document.getElementById('scrollSpeed').value=scrollSpeed;
  setViewMode(viewMode);
  loadingOverlay.style.display='none';
  showToast('📖 مرحباً! الخط العربي تم إصلاحه');
 }catch(e){loadingOverlay.innerHTML='<div style="color:#f44">فشل: '+e.message+'<br><a href="'+url+'" target="_blank" style="color:#FF6B00">تحميل</a></div>';}
}

async function renderPage(num){
 if(!pdfDoc) return;
 const page=await pdfDoc.getPage(num);
 const vp=page.getViewport({scale:currentScale});
 const dpr=window.devicePixelRatio||1;
 const canvas=document.createElement('canvas');
 const ctx=canvas.getContext('2d');
 canvas.width=vp.width*dpr*1.8;
 canvas.height=vp.height*dpr*1.8;
 canvas.style.width=vp.width+'px';
 canvas.style.height=vp.height+'px';
 canvas.className='pdf-page';
 ctx.setTransform(dpr*1.8,0,0,dpr*1.8,0,0);
 await page.render({canvasContext:ctx,viewport:vp}).promise;
 pdfViewer.innerHTML='';
 pdfViewer.appendChild(canvas);
 pageNumInput.value=num;
 currentPage=num;
 localStorage.setItem('progress_'+bookId, num);
}

async function renderAll(){
 pdfViewer.innerHTML='';
 pageElements=[];
 const dpr=window.devicePixelRatio||1;
 for(let i=1;i<=totalPages;i++){
  const page=await pdfDoc.getPage(i);
  const vp=page.getViewport({scale:currentScale});
  const canvas=document.createElement('canvas');
  const ctx=canvas.getContext('2d');
  canvas.width=vp.width*dpr*1.8;
  canvas.height=vp.height*dpr*1.8;
  canvas.style.width='100%';
  canvas.style.maxWidth='800px';
  canvas.className='pdf-page';
  ctx.setTransform(dpr*1.8,0,0,dpr*1.8,0,0);
  await page.render({canvasContext:ctx,viewport:vp}).promise;
  const wrap=document.createElement('div');
  wrap.className='pdf-page-wrapper';
  wrap.innerHTML='<div class="pdf-page-label">📄 صفحة '+i+' / '+totalPages+'</div>';
  wrap.appendChild(canvas);
  pdfViewer.appendChild(wrap);
  pageElements.push({wrap, num:i});
 }
}

function setViewMode(m){
 viewMode=m;
 localStorage.setItem('viewMode',m);
 if(m==='scrolling'){
  container.classList.add('scrolling-mode');
  document.getElementById('scrollingModeBtn').classList.add('active');
  document.getElementById('paginationModeBtn').classList.remove('active');
  renderAll();
 }else{
  container.classList.remove('scrolling-mode');
  document.getElementById('scrollingModeBtn').classList.remove('active');
  document.getElementById('paginationModeBtn').classList.add('active');
  renderPage(currentPage);
 }
}
function nextPage(){if(currentPage<totalPages){currentPage++; renderPage(currentPage);}}
function prevPage(){if(currentPage>1){currentPage--; renderPage(currentPage);}}
function zoomIn(){currentScale=Math.min(3,currentScale+0.2); zoomLevelSpan.textContent=Math.round(currentScale*100)+'%'; setViewMode(viewMode);}
function zoomOut(){currentScale=Math.max(0.6,currentScale-0.2); zoomLevelSpan.textContent=Math.round(currentScale*100)+'%'; setViewMode(viewMode);}
function resetZoom(){currentScale=1.6; zoomLevelSpan.textContent='100%'; setViewMode(viewMode);}
function openFullscreen(){document.documentElement.requestFullscreen();}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');}
function toggleNightMode(){isNight=!isNight; document.body.classList.toggle('night-mode',isNight); localStorage.setItem('nightMode',isNight);}
function toggleFocusMode(){isFocus=!isFocus; document.body.classList.toggle('focus-mode',isFocus); if(isFocus){document.querySelector('.pdf-toolbar').style.opacity='0';}else{document.querySelector('.pdf-toolbar').style.opacity='1';} document.addEventListener('mousemove',()=>{if(isFocus){document.querySelector('.pdf-toolbar').style.opacity='1'; setTimeout(()=>{if(isFocus) document.querySelector('.pdf-toolbar').style.opacity='0';},3000);}});}
function toggleAutoScroll(){if(autoScrollActive){clearInterval(autoScrollInterval); autoScrollActive=false; document.getElementById('autoScrollBtn').textContent='▶️';}else{autoScrollActive=true; document.getElementById('autoScrollBtn').textContent='⏸️'; autoScrollInterval=setInterval(()=>{if(viewMode==='scrolling'){container.scrollBy({top:scrollSpeed*2,behavior:'smooth'});}else{nextPage();}}, viewMode==='scrolling'?100:3000);}}
function updateScrollSpeed(){scrollSpeed=parseInt(document.getElementById('scrollSpeed').value); document.getElementById('speedValue').textContent=scrollSpeed;}
function addBookmark(){let b=JSON.parse(localStorage.getItem('bookmarks_'+bookId)||'[]'); if(b.find(x=>x.page_number===currentPage)){showToast('الإشارة موجودة');return;} const note=prompt('ملاحظة:',''); b.push({page_number:currentPage,note:note||''}); localStorage.setItem('bookmarks_'+bookId,JSON.stringify(b)); loadBookmarks(); showToast('✅ تمت إضافة إشارة');}
function loadBookmarks(){const b=JSON.parse(localStorage.getItem('bookmarks_'+bookId)||'[]'); const c=document.getElementById('bookmarksList'); if(b.length){c.innerHTML=b.map(x=>`<div class="bookmark-item" onclick="goToBookmark(${x.page_number})">📌 صفحة ${x.page_number}${x.note?'<br><small>'+x.note+'</small>':''} <button onclick="event.stopPropagation();removeBookmark(${x.page_number})" style="float:left;background:#f44;border:0;color:#fff;padding:2px 6px;border-radius:10px;font-size:10px">حذف</button></div>`).join('');}else{c.innerHTML='<p style="color:#aaa;text-align:center;padding:20px">لا توجد إشارات</p>';}}
function removeBookmark(n){let b=JSON.parse(localStorage.getItem('bookmarks_'+bookId)||'[]'); b=b.filter(x=>x.page_number!==n); localStorage.setItem('bookmarks_'+bookId,JSON.stringify(b)); loadBookmarks();}
function goToBookmark(n){currentPage=n; setViewMode(viewMode); if(viewMode==='scrolling'){document.querySelectorAll('.pdf-page-wrapper')[n-1]?.scrollIntoView({behavior:'smooth'});}else{renderPage(n);} toggleSidebar();}
function exportBookmarks(){const b=JSON.parse(localStorage.getItem('bookmarks_'+bookId)||'[]'); if(!b.length){showToast('لا توجد إشارات');return;} let t='إشارات - '+(bookData?.title||'')+'\n'; b.forEach(x=>{t+='صفحة '+x.page_number+(x.note?' - '+x.note:'')+'\n';}); const blob=new Blob([t],{type:'text/plain'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='bookmarks_'+bookId+'.txt'; a.click();}
function copyShareLink(){navigator.clipboard.writeText(location.href); showToast('✅ تم نسخ الرابط');}
function showToast(m){const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),3000);}
document.getElementById('pageNum').addEventListener('change',e=>{let p=parseInt(e.target.value); if(p>=1&&p<=totalPages){currentPage=p; renderPage(p);}});
pageNumInput.addEventListener('keydown',e=>{if(e.key==='Enter'){let p=parseInt(e.target.value); if(p>=1&&p<=totalPages){currentPage=p; renderPage(p);}}});
document.addEventListener('DOMContentLoaded',()=>{
 const url=encodeURIComponent(location.href);
 document.getElementById('shareWaBtn').href='https://wa.me/?text='+encodeURIComponent('📖 '+(bookData?.title||'كتاب'))+' '+url;
 document.getElementById('shareFbBtn').href='https://www.facebook.com/sharer/sharer.php?u='+url;
 document.getElementById('shareXBtn').href='https://twitter.com/intent/tweet?text='+encodeURIComponent('📖')+'&url='+url;
});
if(bookId){loadBook(); setTimeout(loadBookmarks,800);}

<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="ht
