<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>قارئ رفوف المتقدم</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Cairo',system-ui;background:#0A0A0A;color:#eee;overflow:hidden;height:100vh}
        
        /* ===== شريط الأدوات ===== */
        .pdf-toolbar{position:fixed;top:0;left:0;right:0;background:linear-gradient(135deg,#111,#1a1a1a);padding:8px 15px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;z-index:1000;box-shadow:0 2px 10px rgba(0,0,0,.5);border-bottom:2px solid #FF6B00}
        .pdf-toolbar button,.pdf-toolbar select{background:rgba(255,255,255,.08);border:1px solid #232323;color:#fff;padding:7px 12px;border-radius:8px;cursor:pointer;font-size:12px;transition:.2s}
        .pdf-toolbar button:hover{background:#FF6B00;color:#000;transform:translateY(-1px)}
        .pdf-toolbar .active{background:#FF6B00;color:#000;box-shadow:0 0 10px rgba(255,107,0,.4)}
        .separator{width:1px;height:26px;background:rgba(255,255,255,.15);margin:0 4px}
        
        .page-controls{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.4);padding:4px 12px;border-radius:40px}
        .page-controls input{width:56px;text-align:center;background:rgba(255,255,255,.12);border:0;color:#fff;padding:4px;border-radius:6px}
        
        .auto-scroll-control{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.4);padding:4px 15px;border-radius:40px}
        .auto-scroll-control button.running{background:#ef4444;animation:pulse 1s infinite}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
        .auto-scroll-control input{width:90px;cursor:pointer;background:rgba(255,255,255,.2);height:4px;border-radius:2px}
        
        /* ===== منطقة العرض ===== */
        #pdfContainer{position:absolute;top:56px;left:0;right:0;bottom:0;overflow:auto;background:#0F0F0F;display:flex;flex-direction:column;align-items:center;padding:20px;gap:16px}
        #pdfContainer.scrolling-mode{overflow-y:auto;overflow-x:auto}
        #pdfContainer.scrolling-mode .pdf-viewer{margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:12px;padding:25px;width:100%}
        #pdfContainer.pagination-mode{overflow:hidden;display:flex;align-items:center;justify-content:center}
        #pdfContainer.pagination-mode .pdf-viewer{margin:0 auto;display:flex;align-items:center;justify-content:center;height:100%;overflow-y:auto;padding:20px}
        #pdfContainer.pagination-mode .pdf-page{margin:15px auto;box-shadow:0 8px 25px rgba(0,0,0,.3)}
        
        .pdf-page{background:#fff;box-shadow:0 4px 15px rgba(0,0,0,.2);border-radius:4px;overflow:hidden}
        .pdf-page canvas{display:block;width:100%;height:auto}
        .pdf-page-wrapper{position:relative;margin:10px 0}
        .pdf-page-label{text-align:center;padding:6px;background:rgba(0,0,0,.6);color:#fff;border-radius:10px 10px 0 0;font-size:12px;font-weight:500}
        
        /* ===== الشريط الجانبي ===== */
        .pdf-sidebar{position:fixed;right:-320px;top:56px;width:300px;bottom:0;background:linear-gradient(180deg,#111,#1a1a1a);transition:right .3s;z-index:1001;overflow-y:auto;padding:20px;border-left:1px solid #FF6B00;box-shadow:-5px 0 20px rgba(0,0,0,.3)}
        .pdf-sidebar.open{right:0}
        .pdf-sidebar h3{margin-bottom:20px;padding-bottom:10px;border-bottom:2px solid #FF6B00;font-size:1.2rem;display:flex;align-items:center;gap:8px}
        .sidebar-toggle{position:fixed;right:15px;top:68px;background:#FF6B00;border:0;color:#fff;width:42px;height:42px;border-radius:50%;cursor:pointer;z-index:1002;font-size:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.3)}
        .sidebar-toggle:hover{transform:scale(1.05);background:#ff8c33}
        
        .bookmark-item{background:rgba(255,255,255,.08);padding:12px;margin-bottom:10px;border-radius:10px;cursor:pointer;transition:.2s;border-right:3px solid transparent}
        .bookmark-item:hover{background:rgba(255,107,0,.3);transform:translateX(-5px);border-right-color:#FF6B00}
        .bookmark-item .page-number{font-weight:700;margin-bottom:5px;display:flex;align-items:center;gap:8px}
        .bookmark-item .note{font-size:11px;color:#aaa;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .bookmark-item .delete-bookmark{float:left;background:rgba(239,68,68,.2);border:0;color:#ff6b6b;cursor:pointer;padding:4px 8px;border-radius:20px;font-size:11px;transition:.2s}
        .bookmark-item .delete-bookmark:hover{background:#ef4444;color:#fff}
        
        /* ===== أزرار المشاركة ===== */
        .mini-share-bar{position:fixed;bottom:25px;right:25px;display:flex;gap:10px;background:rgba(0,0,0,.75);backdrop-filter:blur(10px);padding:10px 15px;border-radius:50px;z-index:1000;border:1px solid rgba(255,255,255,.2)}
        .mini-share-btn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:18px;transition:.2s;cursor:pointer;border:0}
        .mini-share-btn:hover{transform:scale(1.1)}
        .share-wa{background:#25D366;color:#fff}
        .share-fb{background:#1877F2;color:#fff}
        .share-x{background:#000;color:#fff}
        .share-copy{background:#64748b;color:#fff;cursor:pointer}
        
        /* ===== أوضاع خاصة ===== */
        body.focus-mode .pdf-toolbar{opacity:0;pointer-events:none;transition:opacity .3s}
        body.focus-mode .sidebar-toggle,body.focus-mode .mini-share-bar{opacity:0;pointer-events:none}
        body.focus-mode #pdfContainer{top:0}
        body.focus-mode:hover .pdf-toolbar,body.focus-mode:hover .sidebar-toggle,body.focus-mode:hover .mini-share-bar{opacity:1;pointer-events:auto}
        
        body.night-mode #pdfContainer{background:#0a0a15}
        body.night-mode .pdf-page canvas{filter:brightness(.85) contrast(1.1)}
        body.night-mode .pdf-toolbar{background:linear-gradient(135deg,#0a0a15,#0f0f1a)}
        
        body.kid-mode .pdf-toolbar button{font-size:16px;padding:10px 18px}
        body.kid-mode .pdf-toolbar{padding:12px 15px}
        body.kid-mode .page-controls input{font-size:16px;padding:8px}
        body.kid-mode .mini-share-btn{width:45px;height:45px;font-size:22px}
        
        body.copy-protection .pdf-page canvas{pointer-events:none}
        body.copy-protection{user-select:none;-webkit-user-select:none}
        
        /* ===== سكرول مخصص ===== */
        #pdfContainer::-webkit-scrollbar{width:8px;height:8px}
        #pdfContainer::-webkit-scrollbar-track{background:#1a1a2e;border-radius:4px}
        #pdfContainer::-webkit-scrollbar-thumb{background:#FF6B00;border-radius:4px}
        #pdfContainer::-webkit-scrollbar-thumb:hover{background:#ff8c33}
        
        /* ===== إشعارات ===== */
        .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#FF6B00;color:#000;padding:10px 24px;border-radius:50px;z-index:2000;animation:fadeInUp .3s;font-size:13px;font-weight:700;box-shadow:0 4px 15px rgba(0,0,0,.3);white-space:nowrap}
        @keyframes fadeInUp{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
        
        /* ===== تحميل ===== */
        .loading-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.8);z-index:2000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:15px}
        .loading-spinner{width:50px;height:50px;border:4px solid rgba(255,255,255,.2);border-top:4px solid #FF6B00;border-radius:50%;animation:spin 1s linear infinite}
        @keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
        .loading-text{color:#fff;font-size:14px}
        
        /* ===== تكيف ===== */
        @media(max-width:900px){.pdf-toolbar{padding:6px 10px;gap:4px}.pdf-toolbar button,.pdf-toolbar select{padding:5px 10px;font-size:11px}.page-controls input{width:50px}}
        @media(max-width:700px){.pdf-toolbar{flex-wrap:wrap;max-height:85px;overflow-y:auto}#pdfContainer{top:85px}.pdf-sidebar{top:85px}.sidebar-toggle{top:95px}.mini-share-bar{bottom:15px;right:15px;padding:6px 12px;gap:6px}.mini-share-btn{width:32px;height:32px;font-size:14px}}
        @media(max-width:480px){.page-controls input{width:45px}.auto-scroll-control input{width:70px}.toast{font-size:11px;padding:8px 18px;white-space:nowrap}}
    </style>
</head>
<body>

<!-- ===== شريط الأدوات ===== -->
<div class="pdf-toolbar">
    <button onclick="window.location.href='/'">🏠</button>
    <button onclick="toggleSidebar()">🔖</button>
    <button onclick="toggleFocusMode()">🎯</button>
    <button onclick="toggleNightMode()">🌙</button>
    <button onclick="toggleKidMode()">🧒</button>
    <button onclick="toggleCopyProtection()">🔒</button>
    <div class="separator"></div>
    <button id="scrollingModeBtn" class="active" onclick="setViewMode('scrolling')">📜 تمرير</button>
    <button id="paginationModeBtn" onclick="setViewMode('pagination')">📄 تقليب</button>
    <div class="separator"></div>
    <div class="auto-scroll-control">
        <button id="autoScrollBtn" onclick="toggleAutoScroll()">▶️</button>
        <input type="range" id="scrollSpeed" min="1" max="20" value="5" onchange="updateScrollSpeed()">
        <span id="speedValue">5</span>
    </div>
    <div class="separator"></div>
    <div id="paginationNav" class="page-controls" style="display:flex">
        <button onclick="prevPage()">◀</button>
        <input type="number" id="pageNum" value="1" min="1" onchange="goToPage()">
        <span id="pageCount">/ 0</span>
        <button onclick="nextPage()">▶</button>
    </div>
    <div class="zoom-control" style="display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.4);padding:4px 12px;border-radius:40px">
        <button onclick="zoomOut()">🔍-</button>
        <span id="zoomLevel">100%</span>
        <button onclick="zoomIn()">🔍+</button>
        <button onclick="resetZoom()">100%</button>
        <button onclick="fitToWidth()">📐</button>
    </div>
    <button onclick="openFullscreen()">🖥️</button>
    <button onclick="window.print()">🖨️</button>
    <button onclick="addBookmark()" id="bookmarkBtn">⭐</button>
</div>

<!-- ===== زر الشريط الجانبي ===== -->
<button class="sidebar-toggle" onclick="toggleSidebar()">📑</button>

<!-- ===== الشريط الجانبي ===== -->
<div class="pdf-sidebar" id="sidebar">
    <h3>📖 الإشارات المرجعية</h3>
    <div id="bookmarksList"><p style="color:#aaa;text-align:center;padding:20px">لا توجد إشارات مرجعية</p></div>
    <hr style="margin:20px 0;border-color:rgba(255,255,255,.1)">
    <button onclick="exportBookmarks()" style="width:100%;background:#FF6B00;border:0;color:#000;padding:12px;border-radius:8px;cursor:pointer;font-weight:700">📤 تصدير الإشارات</button>
</div>

<!-- ===== أزرار المشاركة ===== -->
<div class="mini-share-bar">
    <a id="shareWaBtn" target="_blank" class="mini-share-btn share-wa">💬</a>
    <a id="shareFbBtn" target="_blank" class="mini-share-btn share-fb">📘</a>
    <a id="shareXBtn" target="_blank" class="mini-share-btn share-x">🐦</a>
    <button class="mini-share-btn share-copy" onclick="copyShareLink()">📋</button>
</div>

<!-- ===== حاوية القارئ ===== -->
<div id="pdfContainer" class="scrolling-mode">
    <div class="loading-overlay" id="loadingOverlay" style="display:none">
        <div class="loading-spinner"></div>
        <div class="loading-text">جاري تحميل الكتاب...</div>
    </div>
    <div class="pdf-viewer" id="pdfViewer"></div>
</div>

<script src="js/api.js"></script>
<script>
// ============================================================
// 1. الحصول على معرف الكتاب من URL
// ============================================================
const params = new URLSearchParams(window.location.search);
const bookId = params.get('id');

if (!bookId) {
    document.getElementById('pdfContainer').innerHTML = '<div style="padding:80px;text-align:center;color:#FF6B00">❌ لم يتم تحديد الكتاب</div>';
}

// ============================================================
// 2. المتغيرات العامة
// ============================================================
let pdfDoc = null;
let currentPage = 1;
let currentScale = 1.2;
let totalPages = 0;
let viewMode = localStorage.getItem('viewMode') || 'scrolling';
let allPagesRendered = false;
let pageElements = [];
let autoScrollActive = false;
let autoScrollInterval = null;
let scrollSpeed = parseInt(localStorage.getItem('scrollSpeed')) || 5;
let bookData = null;

// الأوضاع
let isNightMode = localStorage.getItem('nightMode') === 'true';
let isFocusMode = localStorage.getItem('focusMode') === 'true';
let isKidMode = localStorage.getItem('kidMode') === 'true';
let isCopyProtection = localStorage.getItem('copyProtection') === 'true';

// عناصر DOM
const pdfViewer = document.getElementById('pdfViewer');
const container = document.getElementById('pdfContainer');
const pageNumInput = document.getElementById('pageNum');
const pageCountSpan = document.getElementById('pageCount');
const zoomLevelSpan = document.getElementById('zoomLevel');
const loadingOverlay = document.getElementById('loadingOverlay');
const bookmarkBtn = document.getElementById('bookmarkBtn');

// ============================================================
// 3. تحميل بيانات الكتاب
// ============================================================
async function loadBook() {
    try {
        loadingOverlay.style.display = 'flex';
        const token = localStorage.getItem('token');
        const headers = token ? { 'Authorization': 'Bearer ' + token } : {};
        const res = await fetch('/api/books/' + bookId + '/view', { headers });
        const data = await res.json();
        
        if (data.error) {
            loadingOverlay.innerHTML = '<div style="color:#ff4444;text-align:center;padding:20px">❌ ' + data.error + '</div>';
            return;
        }
        
        bookData = data;
        document.title = 'قراءة: ' + bookData.title + ' - رفوف';
        
        // تحميل ملف PDF
        const pdfUrl = '/api/books/' + bookId + '/pdf';
        await loadPDF(pdfUrl);
        
    } catch (error) {
        console.error('خطأ:', error);
        loadingOverlay.innerHTML = '<div style="color:#ff4444;text-align:center;padding:20px">❌ فشل تحميل الكتاب</div>';
    }
}

// ============================================================
// 4. تحميل وعرض PDF
// ============================================================
async function loadPDF(pdfUrl) {
    try {
        pdfDoc = await pdfjsLib.getDocument(pdfUrl).promise;
        totalPages = pdfDoc.numPages;
        pageCountSpan.textContent = '/ ' + totalPages;
        pageNumInput.max = totalPages;
        pageNumInput.value = currentPage;
        
        // تطبيق الأوضاع
        if (isNightMode) document.body.classList.add('night-mode');
        if (isFocusMode) document.body.classList.add('focus-mode');
        if (isKidMode) document.body.classList.add('kid-mode');
        if (isCopyProtection) document.body.classList.add('copy-protection');
        
        // إعداد سرعة التمرير
        document.getElementById('scrollSpeed').value = scrollSpeed;
        document.getElementById('speedValue').textContent = scrollSpeed;
        
        // عرض الصفحات
        setViewMode(viewMode);
        loadingOverlay.style.display = 'none';
        
        // رسالة ترحيب
        if (!localStorage.getItem('reader_welcome_shown')) {
            showToast('📖 مرحباً! استخدم الأسهم للتنقل، ⭐ للإشارات', 'info', 4000);
            localStorage.setItem('reader_welcome_shown', 'true');
        }
        
    } catch (error) {
        console.error('خطأ في تحميل PDF:', error);
        loadingOverlay.innerHTML = '<div style="color:#ff4444;text-align:center;padding:20px">❌ فشل تحميل الملف: ' + error.message + '</div>';
    }
}

// ============================================================
// 5. عرض الصفحات
// ============================================================
async function renderPage(pageNum) {
    if (!pdfDoc) return;
    try {
        const page = await pdfDoc.getPage(pageNum);
        const viewport = page.getViewport({ scale: currentScale });
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;
        canvas.className = 'pdf-page';
        await page.render({ canvasContext: ctx, viewport }).promise;
        
        pdfViewer.innerHTML = '';
        pdfViewer.appendChild(canvas);
        pdfViewer.style.width = viewport.width + 'px';
        pageNumInput.value = pageNum;
        currentPage = pageNum;
        updateBookmarkButton();
        saveProgress();
        
    } catch (error) {
        console.error('خطأ في عرض الصفحة:', error);
    }
}

async function renderAllPages() {
    if (!pdfDoc) return;
    pdfViewer.innerHTML = '';
    pageElements = [];
    
    for (let i = 1; i <= totalPages; i++) {
        try {
            const page = await pdfDoc.getPage(i);
            const viewport = page.getViewport({ scale: currentScale });
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.height = viewport.height;
            canvas.width = viewport.width;
            canvas.className = 'pdf-page';
            await page.render({ canvasContext: ctx, viewport }).promise;
            
            const wrapper = document.createElement('div');
            wrapper.className = 'pdf-page-wrapper';
            const label = document.createElement('div');
            label.className = 'pdf-page-label';
            label.textContent = '📄 صفحة ' + i + ' / ' + totalPages;
            wrapper.appendChild(label);
            wrapper.appendChild(canvas);
            pdfViewer.appendChild(wrapper);
            pageElements.push({ wrapper, canvas, pageNum: i });
            
        } catch (error) {
            console.error('خطأ في عرض الصفحة ' + i, error);
        }
    }
    allPagesRendered = true;
    restoreScrollPosition();
    setupScrollListener();
    updateCurrentPageFromScroll();
}

// ============================================================
// 6. وضع العرض
// ============================================================
function setViewMode(mode) {
    viewMode = mode;
    localStorage.setItem('viewMode', mode);
    
    if (mode === 'scrolling') {
        container.classList.remove('pagination-mode');
        container.classList.add('scrolling-mode');
        document.getElementById('scrollingModeBtn').classList.add('active');
        document.getElementById('paginationModeBtn').classList.remove('active');
        document.getElementById('paginationNav').style.display = 'none';
        if (pdfDoc && !allPagesRendered) renderAllPages();
        else if (pdfDoc) rerenderAllPages();
    } else {
        container.classList.remove('scrolling-mode');
        container.classList.add('pagination-mode');
        document.getElementById('scrollingModeBtn').classList.remove('active');
        document.getElementById('paginationModeBtn').classList.add('active');
        document.getElementById('paginationNav').style.display = 'flex';
        if (pdfDoc) { allPagesRendered = false; renderPage(currentPage); }
    }
}

async function rerenderAllPages() {
    if (viewMode === 'scrolling' && allPagesRendered) {
        const scrollTop = container.scrollTop;
        await renderAllPages();
        container.scrollTop = scrollTop;
    } else if (viewMode === 'pagination') {
        await renderPage(currentPage);
    }
}

// ============================================================
// 7. التنقل بين الصفحات
// ============================================================
function nextPage() { if (currentPage < totalPages) renderPage(currentPage + 1); }
function prevPage() { if (currentPage > 1) renderPage(currentPage - 1); }
function goToPage() {
    let page = parseInt(pageNumInput.value);
    if (isNaN(page)) page = 1;
    page = Math.min(Math.max(page, 1), totalPages);
    renderPage(page);
}

// ============================================================
// 8. التكبير والتصغير
// ============================================================
function zoomIn() { currentScale = Math.min(currentScale + 0.2, 3.0); updateZoom(); }
function zoomOut() { currentScale = Math.max(currentScale - 0.2, 0.6); updateZoom(); }
function resetZoom() { currentScale = 1.2; updateZoom(); }
function fitToWidth() {
    const w = container.clientWidth - 60;
    currentScale = Math.max(0.6, Math.min(2.5, w / 700));
    updateZoom();
}
function updateZoom() {
    zoomLevelSpan.textContent = Math.round(currentScale * 100) + '%';
    if (pdfDoc) {
        if (viewMode === 'scrolling' && allPagesRendered) rerenderAllPages();
        else if (viewMode === 'pagination') renderPage(currentPage);
        else if (viewMode === 'scrolling' && !allPagesRendered) renderAllPages();
    }
}
function openFullscreen() {
    const e = document.documentElement;
    if (e.requestFullscreen) e.requestFullscreen();
    else if (e.webkitRequestFullscreen) e.webkitRequestFullscreen();
    else if (e.msRequestFullscreen) e.msRequestFullscreen();
}

// ============================================================
// 9. التمرير التلقائي
// ============================================================
function toggleAutoScroll() {
    if (autoScrollActive) stopAutoScroll();
    else startAutoScroll();
}
function startAutoScroll() {
    if (autoScrollActive) return;
    autoScrollActive = true;
    const btn = document.getElementById('autoScrollBtn');
    btn.textContent = '⏸️';
    btn.classList.add('running');
    
    const ind = document.createElement('div');
    ind.id = 'autoScrollIndicator';
    ind.className = 'auto-scroll-indicator';
    ind.innerHTML = '📜 تمرير تلقائي... اضغط للإيقاف';
    ind.onclick = stopAutoScroll;
    document.body.appendChild(ind);
    
    if (viewMode === 'scrolling') {
        autoScrollInterval = setInterval(() => {
            if (container.scrollTop + container.clientHeight >= container.scrollHeight - 80) {
                showToast('🎉 وصلت للنهاية', 'success');
                stopAutoScroll();
            } else container.scrollBy({ top: scrollSpeed, behavior: 'smooth' });
        }, 80);
    } else {
        autoScrollInterval = setInterval(() => {
            if (currentPage < totalPages) { nextPage(); showToast('📖 صفحة ' + currentPage, 'info', 1500); }
            else { showToast('🎉 وصلت للنهاية', 'success'); stopAutoScroll(); }
        }, 2500 / (scrollSpeed / 5));
    }
}
function stopAutoScroll() {
    if (autoScrollInterval) { clearInterval(autoScrollInterval); autoScrollInterval = null; }
    autoScrollActive = false;
    const btn = document.getElementById('autoScrollBtn');
    btn.textContent = '▶️';
    btn.classList.remove('running');
    const ind = document.getElementById('autoScrollIndicator');
    if (ind) ind.remove();
}
function updateScrollSpeed() {
    const input = document.getElementById('scrollSpeed');
    scrollSpeed = parseInt(input.value);
    document.getElementById('speedValue').textContent = scrollSpeed;
    localStorage.setItem('scrollSpeed', scrollSpeed);
    if (autoScrollActive) { stopAutoScroll(); startAutoScroll(); }
}

// ============================================================
// 10. مراقبة التمرير
// ============================================================
let scrollTimeout;
function setupScrollListener() {
    container.removeEventListener('scroll', handleScroll);
    container.addEventListener('scroll', handleScroll);
}
function handleScroll() {
    if (scrollTimeout) clearTimeout(scrollTimeout);
    scrollTimeout = setTimeout(() => {
        saveScrollPosition();
        updateCurrentPageFromScroll();
    }, 200);
}
function updateCurrentPageFromScroll() {
    if (viewMode === 'scrolling' && pageElements.length > 0) {
        const rect = container.getBoundingClientRect();
        let visible = 1;
        for (let i = 0; i < pageElements.length; i++) {
            const r = pageElements[i].wrapper.getBoundingClientRect();
            if (r.top <= rect.top + 150 && r.bottom >= rect.top + 150) {
                visible = pageElements[i].pageNum;
                break;
            }
        }
        if (visible !== currentPage) {
            currentPage = visible;
            pageNumInput.value = currentPage;
            updateBookmarkButton();
            saveProgress();
        }
    }
}
function saveScrollPosition() {
    if (viewMode === 'scrolling') {
        localStorage.setItem('scroll_pos_' + bookId, container.scrollTop);
    }
}
function restoreScrollPosition() {
    if (viewMode === 'scrolling') {
        const saved = localStorage.getItem('scroll_pos_' + bookId);
        if (saved && parseInt(saved) > 0) {
            setTimeout(() => { container.scrollTop = parseInt(saved); }, 200);
        }
    }
}

// ============================================================
// 11. الإشارات المرجعية
// ============================================================
async function addBookmark() {
    const token = localStorage.getItem('token');
    if (!token) { showToast('❌ يرجى تسجيل الدخول أولاً', 'error'); return; }
    const note = prompt('📝 أضف ملاحظة (اختياري):', '');
    try {
        const res = await fetch('/api/bookmarks', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify({ book_id: bookId, page_number: currentPage, note: note || '' })
        });
        const data = await res.json();
        if (data.success) {
            showToast('✅ تمت إضافة الإشارة للصفحة ' + currentPage, 'success');
            loadBookmarks();
            updateBookmarkButton();
        } else showToast(data.error || 'حدث خطأ', 'error');
    } catch (error) { showToast('فشل في إضافة الإشارة', 'error'); }
}

async function removeBookmark(pageNum) {
    if (!confirm('هل أنت متأكد من إزالة الإشارة من الصفحة ' + pageNum + '؟')) return;
    const token = localStorage.getItem('token');
    try {
        const res = await fetch('/api/bookmarks?book_id=' + bookId + '&page_number=' + pageNum, {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + token }
        });
        const data = await res.json();
        if (data.success) {
            showToast('✅ تمت إزالة الإشارة', 'success');
            loadBookmarks();
            updateBookmarkButton();
        }
    } catch (error) { showToast('فشل في إزالة الإشارة', 'error'); }
}

function goToBookmark(pageNum) {
    if (viewMode === 'scrolling') {
        const el = pageElements.find(p => p.pageNum === pageNum);
        if (el) el.wrapper.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } else renderPage(pageNum);
    toggleSidebar();
}

async function loadBookmarks() {
    const token = localStorage.getItem('token');
    if (!token) return;
    try {
        const res = await fetch('/api/bookmarks?book_id=' + bookId, {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        const data = await res.json();
        const container = document.getElementById('bookmarksList');
        if (data.bookmarks && data.bookmarks.length > 0) {
            container.innerHTML = data.bookmarks.map(bm => `
                <div class="bookmark-item" onclick="goToBookmark(${bm.page_number})">
                    <div class="page-number">📌 الصفحة ${bm.page_number}</div>
                    ${bm.note ? `<div class="note">📝 ${bm.note}</div>` : ''}
                    <button class="delete-bookmark" onclick="event.stopPropagation(); removeBookmark(${bm.page_number})">🗑️ حذف</button>
                </div>
            `).join('');
        } else {
            container.innerHTML = '<p style="color:#aaa;text-align:center;padding:20px">لا توجد إشارات مرجعية</p>';
        }
    } catch (error) { console.error('خطأ:', error); }
}

function updateBookmarkButton() {
    const token = localStorage.getItem('token');
    if (!token) return;
    fetch('/api/bookmarks?book_id=' + bookId, { headers: { 'Authorization': 'Bearer ' + token } })
        .then(r => r.json())
        .then(data => {
            if (data.bookmarks) {
                const exists = data.bookmarks.some(b => b.page_number === currentPage);
                bookmarkBtn.style.opacity = exists ? '1' : '0.5';
                bookmarkBtn.style.transform = exists ? 'scale(1.1)' : 'scale(1)';
            }
        }).catch(() => {});
}

function exportBookmarks() {
    const token = localStorage.getItem('token');
    if (!token) { showToast('❌ يرجى تسجيل الدخول أولاً', 'error'); return; }
    fetch('/api/bookmarks?book_id=' + bookId, { headers: { 'Authorization': 'Bearer ' + token } })
        .then(r => r.json())
        .then(data => {
            if (!data.bookmarks || data.bookmarks.length === 0) {
                showToast('لا توجد إشارات للتصدير', 'warning');
                return;
            }
            let content = 'الإشارات المرجعية - ' + (bookData?.title || 'كتاب') + '\n';
            content += 'التاريخ: ' + new Date().toLocaleString() + '\n';
            content += 'الرابط: ' + window.location.href + '\n';
            content += '='.repeat(50) + '\n\n';
            data.bookmarks.forEach(bm => {
                content += '📖 صفحة ' + bm.page_number;
                if (bm.note) content += ' - ملاحظة: ' + bm.note;
                content += '\n' + '-'.repeat(30) + '\n';
            });
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'bookmarks_' + bookId + '.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('✅ تم التصدير', 'success');
        }).catch(() => showToast('فشل التصدير', 'error'));
}

// ============================================================
// 12. حفظ تقدم القراءة
// ============================================================
function saveProgress() {
    const token = localStorage.getItem('token');
    if (!token) return;
    const data = { book_id: bookId, current_page: currentPage };
    if (viewMode === 'scrolling') data.scroll_position = container.scrollTop;
    fetch('/api/progress', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify(data)
    }).catch(() => {});
}

// ============================================================
// 13. الأوضاع الخاصة
// ============================================================
function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
}
function toggleNightMode() {
    isNightMode = !isNightMode;
    document.body.classList.toggle('night-mode', isNightMode);
    localStorage.setItem('nightMode', isNightMode);
    showToast(isNightMode ? '🌙 ليلي' : '☀️ نهاري', 'info');
}
function toggleFocusMode() {
    isFocusMode = !isFocusMode;
    document.body.classList.toggle('focus-mode', isFocusMode);
    localStorage.setItem('focusMode', isFocusMode);
    showToast(isFocusMode ? '🎯 تركيز' : '👁️ عادي', 'info');
}
function toggleKidMode() {
    isKidMode = !isKidMode;
    document.body.classList.toggle('kid-mode', isKidMode);
    localStorage.setItem('kidMode', isKidMode);
    showToast(isKidMode ? '🧒 أطفال' : '👨 عادي', 'info');
}
function toggleCopyProtection() {
    isCopyProtection = !isCopyProtection;
    document.body.classList.toggle('copy-protection', isCopyProtection);
    localStorage.setItem('copyProtection', isCopyProtection);
    showToast(isCopyProtection ? '🔒 حماية' : '🔓 عادي', 'info');
}

// ============================================================
// 14. مشاركة
// ============================================================
function copyShareLink() {
    navigator.clipboard.writeText(window.location.href);
    showToast('✅ تم نسخ الرابط', 'success');
}
document.addEventListener('DOMContentLoaded', function() {
    const url = encodeURIComponent(window.location.href);
    const text = encodeURIComponent('📖 ' + (bookData?.title || 'كتاب'));
    document.getElementById('shareWaBtn').href = 'https://wa.me/?text=' + text + '%20-%20' + url;
    document.getElementById('shareFbBtn').href = 'https://www.facebook.com/sharer/sharer.php?u=' + url;
    document.getElementById('shareXBtn').href = 'https://twitter.com/intent/tweet?text=' + text + '&url=' + url;
});

// ============================================================
// 15. إشعارات
// ============================================================
function showToast(message, type = 'info', duration = 3000) {
    const old = document.querySelector('.toast');
    if (old) old.remove();
    const toast = document.createElement('div');
    toast.className = 'toast';
    const colors = { error: '#ef4444', success: '#10b981', info: '#FF6B00' };
    toast.style.background = colors[type] || '#FF6B00';
    toast.textContent = message;
    document.body.appendChild(toast);
    setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, duration);
}

// ============================================================
// 16. اختصارات لوحة المفاتيح
// ============================================================
document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' && viewMode === 'pagination') nextPage();
    if (e.key === 'ArrowLeft' && viewMode === 'pagination') prevPage();
    if (e.key === 'ArrowDown' && viewMode === 'scrolling') container.scrollBy({ top: 150, behavior: 'smooth' });
    if (e.key === 'ArrowUp' && viewMode === 'scrolling') container.scrollBy({ top: -150, behavior: 'smooth' });
    if (e.key === '+') zoomIn();
    if (e.key === '-') zoomOut();
    if (e.key === 's' || e.key === 'S') toggleAutoScroll();
    if (e.key === 'f' || e.key === 'F') toggleFocusMode();
    if (e.key === 'n' || e.key === 'N') toggleNightMode();
    if (e.key === 'k' || e.key === 'K') toggleKidMode();
});

// ============================================================
// 17. بدء التشغيل
// ============================================================
if (bookId) {
    loadBook();
    // تحميل الإشارات بعد تسجيل الدخول
    if (localStorage.getItem('token')) {
        setTimeout(loadBookmarks, 1000);
    }
}
</script>
