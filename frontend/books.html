<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الكتب - رفوف</title><link rel="stylesheet" href="css/style.css"></head>
<body><header><h1>📚 الكتب</h1><nav><a href="index.html">الرئيسية</a></nav></header><main><div class="grid" id="grid"></div></main>
<script src="js/api.js"></script><script>
fetch('/api/books').then(r=>r.json()).then(books=>{
  document.getElementById('grid').innerHTML=books.map(b=>'<div class="card"><img src="'+(b.cover_url||'')+'" style="width:100%;height:180px;object-fit:cover"><h4>'+b.title+'</h4><p>'+(b.author||'')+'</p><a href="reader.html?id='+b.id+'">قراءة</a></div>').join('');
});
</script></body></html>
