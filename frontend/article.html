
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مقال - V36 المرن</title>
<link rel="stylesheet" href="css/style.css">
<style>
.article-layout{display:grid;grid-template-columns:1fr 300px;gap:24px;max-width:1200px;margin:0 auto;padding:20px}
@media(max-width:900px){.article-layout{grid-template-columns:1fr}}
.article-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;line-height:1.9}
.series-bar{background:#1a1200;border:1px solid #FF6B00;border-radius:12px;padding:12px 16px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.chapter-list{background:#111;border:1px solid #222;border-radius:12px;overflow:hidden;margin-top:20px}
.chapter-item{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #1e1e1e;text-decoration:none;color:#fff}
.chapter-item:hover{background:#1a1a1a}
.num{background:#222;color:#FF6B00;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
</style>
</head>
<body>
<header><h1>📚 رفوف</h1><nav><a href="index.html">الرئيسية</a><a href="articles.html">المقالات</a><a href="publisher.html">لوحة الناشر</a></nav></header>

<main class="article-layout">
<div>
  <div id="series-bar"></div>
  <article class="article-card">
    <h1 id="title">جاري التحميل...</h1>
    <p id="author" style="color:#888;font-size:14px"></p>
    <img id="cover" style="max-width:100%;display:none;border-radius:12px;margin:16px 0">
    <div id="content" style="margin-top:20px;color:#ddd;white-space:pre-wrap"></div>
    
  <div id="share-wrap" style="margin-top:25px;padding:15px;background:rgba(255,255,255,.05);border-radius:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <span style="color:#888;font-size:14px">مشاركة:</span>
    <a class="share-btn" id="share-wa" target="_blank" style="width:40px;height:40px;border-radius:50%;background:#25D366;color:#fff;display:flex;align-items:center;justify-content:center;text-decoration:none">W</a>
    <a class="share-btn" id="share-fb" target="_blank" style="width:40px;height:40px;border-radius:50%;background:#1877F2;color:#fff;display:flex;align-items:center;justify-content:center;text-decoration:none">f</a>
    <a class="share-btn" id="share-x" target="_blank" style="width:40px;height:40px;border-radius:50%;background:#000;border:1px solid #333;color:#fff;display:flex;align-items:center;justify-content:center;text-decoration:none">X</a>
    <a class="share-btn" style="width:40px;height:40px;border-radius:50%;background:#444;color:#fff;display:flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer" onclick="navigator.clipboard.writeText(location.href);alert('تم نسخ الرابط ✅')">📋</a>
  </div>

  </article>
  <div id="chapters-box"></div>
</div>
<aside>
  <div id="related"></div>
</aside>
</main>

<script src="js/api.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async ()=>{
  const id=new URLSearchParams(location.search).get('id');
  if(!id){ document.getElementById('title').textContent='مقال غير موجود'; return; }
  try{
    const a=await fetch('/api/articles/'+id).then(r=>r.json());
    if(a.error){ document.getElementById('title').textContent=a.error; return; }
    
    document.title = a.title + ' - رفوف';
    document.getElementById('title').textContent=a.title;
    document.getElementById('author').textContent=(a.author_name||'')+' - '+(a.created_at?new Date(a.created_at).toLocaleDateString('ar-EG'):'');
    document.getElementById('content').textContent=a.content||'';
    
    // share links
    const wa=document.getElementById('share-wa'); const fb=document.getElementById('share-fb'); const x=document.getElementById('share-x');
    if(wa) wa.href = `https://wa.me/?text=${encodeURIComponent(a.title + ' - ' + location.href)}`;
    if(fb) fb.href = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(location.href)}`;
    if(x) x.href = `https://twitter.com/intent/tweet?url=${encodeURIComponent(location.href)}&text=${encodeURIComponent(a.title)}`;

    if(a.cover_url){ const img=document.getElementById('cover'); img.src=a.cover_url; img.style.display='block'; }

    // لو ده فصل (عنده parent_id) اعرض شريط الرجوع للأم
    if(a.parent_id){
      document.getElementById('series-bar').innerHTML = `
        <div class="series-bar">
          <div>📖 فصل ${a.chapter_order||''} من <a href="article.html?id=${a.parent_id}" style="color:#FF6B00;font-weight:700">السلسلة الأم #${a.parent_id}</a></div>
          <a href="article.html?id=${a.parent_id}" style="color:#aaa;font-size:13px">عرض كل الفصول</a>
        </div>`;
      // حمل الفصول الأخرى لنفس الأم
      const siblings = await fetch('/api/articles/'+a.parent_id+'/chapters').then(r=>r.json()).catch(()=>[]);
      if(siblings.length){
        document.getElementById('chapters-box').innerHTML = `
          <h3 style="margin:20px 0 10px">فصول أخرى من نفس السلسلة</h3>
          <div class="chapter-list">
            ${siblings.map(ch=>`
              <a class="chapter-item" href="article.html?id=${ch.id}" style="${ch.id==a.id?'background:#1a1200;border-color:#FF6B00':''}">
                <div style="display:flex;gap:10px;align-items:center"><div class="num">${ch.chapter_order||'•'}</div><div>${ch.title}</div></div>
                <div style="color:#666">${ch.id==a.id?'أنت هنا':'اقرأ →'}</div>
              </a>
            `).join('')}
          </div>`;
      }
    }
    // لو ده مقال مفتوح (سلسلة أم) اعرض فصوله
    else if(a.is_open==1){
      document.getElementById('series-bar').innerHTML = `<div class="series-bar"><div>🔓 هذه سلسلة مفتوحة - تحتوي على ${a.chapters ? a.chapters.length : 0} فصل</div><span style="background:#FF6B00;color:#000;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:700">سلسلة</span></div>`;
      
      const chapters = a.chapters || [];
      if(chapters.length){
        document.getElementById('chapters-box').innerHTML = `
          <h3 style="margin:20px 0 10px">الفهرس (${chapters.length} فصل)</h3>
          <div class="chapter-list">
            ${chapters.map(ch=>`
              <a class="chapter-item" href="article.html?id=${ch.id}">
                <div style="display:flex;gap:10px;align-items:center"><div class="num">${ch.chapter_order||'•'}</div><div><div style="font-weight:600">${ch.title}</div></div></div>
                <div style="color:#666">اقرأ →</div>
              </a>
            `).join('')}
          </div>`;
      } else {
        document.getElementById('chapters-box').innerHTML = '<div style="padding:20px;color:#888;background:#111;border-radius:12px;margin-top:20px">لم تتم إضافة فصول بعد. من لوحة الناشر اختر هذه السلسلة كأب للمقال الجديد.</div>';
      }
    }

  }catch(e){
    document.getElementById('title').textContent='خطأ: '+e.message;
  }
});
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
</html>
