<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة الإدارة - رفوف</title>
<link rel="stylesheet" href="css/style.css">
<style>
.admin-wrap{max-width:1200px;margin:0 auto;padding:20px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin:24px 0}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px}
.stat-card b{font-size:26px;display:block;color:#ff6b00}
.quick-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:20px 0}
.action-btn{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 16px;text-decoration:none;color:#fff}
.action-btn.primary{background:#ff6b00;border-color:#ff6b00}
.tabs{display:flex;gap:8px;margin:20px 0;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:100px;border:1px solid var(--border);background:transparent;color:#888;cursor:pointer}
.tab.active{background:#fff;color:#000}
.table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden}
.table th,.table td{padding:10px;text-align:right;border-bottom:1px solid var(--border);font-size:13px}
.req-card{background:#111;border:1px solid #222;border-radius:12px;padding:14px;margin:10px 0;display:flex;gap:12px;align-items:center}
.btn{padding:6px 12px;border-radius:8px;border:none;cursor:pointer;font-size:12px}
.btn-approve{background:#22c55e;color:#fff} .btn-reject{background:#ef4444;color:#fff}
</style>
</head>
<body>
<header><h1>📚 رفوف - لوحة الإدارة</h1><nav><a href="index.html">الرئيسية</a><a href="profile.html">بروفايلي</a><a href="admin-ads.html">الإعلانات</a><a href="#" onclick="logout()">خروج</a></nav></header>
<div class="admin-wrap">
  <h2>لوحة التحكم 👑</h2>
  <div class="stats-grid" id="statsGrid"><div class="stat-card"><b>...</b><span>جاري التحميل</span></div></div>
  
  <div class="quick-actions">
    <a href="upload-book.html" class="action-btn primary">📚 رفع كتاب جديد</a>
    <a href="upload-article.html" class="action-btn">📝 كتابة مقالة</a>
    <a href="publisher.html" class="action-btn">🧑‍💼 لوحة الناشر</a>
    <a href="author.html?id=1" class="action-btn">👤 صفحتي العامة</a>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="requests">طلبات الناشرين</button>
    <button class="tab" data-tab="users">المستخدمين</button>
    <button class="tab" data-tab="books">الكتب</button>
    <button class="tab" data-tab="articles">المقالات</button>
  </div>

  <div id="tab-requests" class="tab-content"><div id="requestsList">جاري التحميل...</div></div>
  <div id="tab-users" class="tab-content" style="display:none"><table class="table" id="usersTable"><thead><tr><th>الناشر</th><th>البريد</th><th>الدور</th><th>كتب</th><th>إجراء</th></tr></thead><tbody></tbody></table></div>
  <div id="tab-books" class="tab-content" style="display:none"><div id="booksList">جاري تحميل الكتب...</div></div>
  <div id="tab-articles" class="tab-content" style="display:none"><div id="articlesList">جاري تحميل المقالات...</div></div>
</div>
<script src="js/api.js"></script>
<script>
async function loadStats(){
  try{
    const [books, articles, users, requests] = await Promise.all([
      apiGet('/api/books').then(r=>r.length||0).catch(()=>0),
      apiGet('/api/articles').then(r=>r.length||0).catch(()=>0),
      apiGet('/api/admin/users').then(r=>r.length||0).catch(()=>0),
      apiGet('/api/publisher-requests').then(r=>r.filter(x=>x.status==='pending').length||0).catch(()=>0)
    ]);
    document.getElementById('statsGrid').innerHTML = `
      <div class="stat-card"><b>${books}</b><span>إجمالي الكتب</span></div>
      <div class="stat-card"><b>${articles}</b><span>إجمالي المقالات</span></div>
      <div class="stat-card"><b>${users}</b><span>المستخدمين</span></div>
      <div class="stat-card"><b style="color:${requests>0?'#f59e0b':'#22c55e'}">${requests}</b><span>طلبات معلقة</span></div>
    `;
  }catch{}
}
async function loadRequests(){
  const res = await apiGet('/api/publisher-requests'); const c=document.getElementById('requestsList');
  if(!res || res.error){ c.innerHTML='<p>خطأ في التحميل</p>'; return; }
  if(res.length===0){ c.innerHTML='<p style="color:#666">✅ لا توجد طلبات معلقة - المنصة نظيفة</p>'; return; }
  c.innerHTML = res.map(r=>`
    <div class="req-card"><div style="width:40px;height:40px;border-radius:50%;background:#222;display:grid;place-items:center">${r.avatar_url?`<img src="${r.avatar_url}" style="width:100%;height:100%;border-radius:50%">`:r.name?.charAt(0)||'U'}</div>
    <div style="flex:1"><b>${r.name}</b> - ${r.email}<br><small style="color:#888">${r.reason||''}</small><br><small style="color:${r.status==='pending'?'#f59e0b':'#22c55e'}">${r.status}</small></div>
    <div>${r.status==='pending'?`<button class="btn btn-approve" onclick="handleReq(${r.id},'approved')">موافقة</button> <button class="btn btn-reject" onclick="handleReq(${r.id},'rejected')">رفض</button>`:`${r.status}`}</div></div>
  `).join('');
}
async function loadUsers(){
  const res = await apiGet('/api/admin/users').catch(()=>[]);
  const tbody = document.querySelector('#usersTable tbody');
  tbody.innerHTML = res.map(u=>`<tr><td style="display:flex;gap:8px;align-items:center"><div style="width:28px;height:28px;border-radius:50%;background:#222;overflow:hidden;display:grid;place-items:center">${u.avatar_url?`<img src="${u.avatar_url}" style="width:100%;height:100%">`:u.display_name?.charAt(0)||'U'}</div><div><b>${u.display_name||u.name}</b><br><small style="color:#666">${u.bio?u.bio.slice(0,25):''}</small></div></td><td>${u.email}</td><td>${u.role} ${u.verified?'✔':''}</td><td>${u.books_count||0}</td><td><a href="author.html?id=${u.id}" style="color:#ff6b00">عرض</a></td></tr>`).join('');
}
async function loadBooks(){
  const books = await apiGet('/api/books').catch(()=>[]);
  document.getElementById('booksList').innerHTML = books.length ? `<table class="table"><tr><th>العنوان</th><th>المؤلف</th><th>إجراء</th></tr>${books.map(b=>`<tr><td>${b.title}</td><td>${b.author||''}</td><td><a href="reader.html?id=${b.id}" style="color:#ff6b00">عرض</a></td></tr>`).join('')}</table>` : 'لا توجد كتب';
}
async function loadArticles(){
  const arts = await apiGet('/api/articles').catch(()=>[]);
  document.getElementById('articlesList').innerHTML = arts.length ? `<table class="table"><tr><th>العنوان</th><th>إجراء</th></tr>${arts.map(a=>`<tr><td>${a.title}</td><td><a href="article.html?id=${a.id}" style="color:#ff6b00">عرض</a></td></tr>`).join('')}</table>` : 'لا توجد مقالات';
}
async function handleReq(id,status){
  if(!confirm(status==='approved'?'موافقة وتحويل لناشر موثق؟':'رفض؟')) return;
  const r = await fetch('/api/publisher-requests/'+id,{method:'PUT',headers:{'Content-Type':'application/json','Authorization':'Bearer '+localStorage.getItem('token')},body:JSON.stringify({status})}).then(x=>x.json());
  if(r.success){ loadRequests(); loadStats(); loadUsers(); } else alert(r.error);
}
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); t.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(x=>x.style.display='none');
    document.getElementById('tab-'+t.dataset.tab).style.display='block';
    if(t.dataset.tab==='users') loadUsers();
    if(t.dataset.tab==='books') loadBooks();
    if(t.dataset.tab==='articles') loadArticles();
  });
});
function logout(){ localStorage.clear(); location.href='login.html'; }
loadStats(); loadRequests();
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
</html>
