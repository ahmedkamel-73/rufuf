name = "rufuf"
main = "worker/src/index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./frontend"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "rufuf-db"
database_id = "REPLACE_WITH_D1_ID"

[[r2_buckets]]
binding = "R2"
bucket_name = "rufuf-storage"

[[durable_objects.bindings]]
name = "FORUM"
class_name = "ForumRoom"

[[migrations]]
tag = "v1"
new_classes = ["ForumRoom"]

[vars]
ENV = "production"

[observability]
enabled = true
